[package]
name = "huge-file-reader"
version = "0.1.0"
edition = "2021"
description = "Search and browse enormous (100 GB+) text files without loading them into memory"
license = "MIT"

[lib]
name = "hfr"
path = "src/lib.rs"

[[bin]]
name = "huge-file-reader"
path = "src/main.rs"

[dependencies]
bytecount = { version = "0.6", features = ["runtime-dispatch-simd"] }
crossbeam-channel = "0.5"
eframe = "0.37"
egui = "0.37"
memchr = "2"
regex = "1"
rfd = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
